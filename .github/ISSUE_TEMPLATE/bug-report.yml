name: Bug report
description: Something does not work as described
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Never post your license key or purchase email here. For license or payment questions, write to contact@batteryonpc.com.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BatteryOnPC version
      placeholder: "Example: 2.0.10"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Example: Windows 11 24H2"
  - type: input
    id: devices
    attributes:
      label: Devices involved
      placeholder: "Example: DualSense over Bluetooth, Logitech G502 X Plus"
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag and drop images here if they help.
